# 推送到 main 分支后：构建 Astro 网站，并发布到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 GitHub 网页的 Actions 页面手动触发
  workflow_dispatch:

# 发布到 Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署：正在进行的不打断，排队中的旧部署会被更新的推送替换
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7
      - name: 安装依赖、构建、打包成 Pages 产物
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
